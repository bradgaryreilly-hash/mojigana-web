<!doctype html>
<html lang="en">
  <head>
    <style>
      /* Runs before JS; avoids a blank white flash if the bundle fails on some browsers */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #0f172a;
      }
    </style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="MojiGana — practice hiragana, katakana, and Japanese number readings."
    />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>MojiGana</title>
  </head>
  <body>
    <div id="root">
      <p
        id="mojigana-boot"
        style="
          margin: 0;
          padding: 1.25rem;
          font-family: system-ui, sans-serif;
          font-size: 0.9rem;
          color: #94a3b8;
        "
      >
        Loading…
      </p>
    </div>
    <!-- Runs without ES modules: if the main bundle never executes, this still fires -->
    <script>
      (function () {
        var ms = 25000;
        function addP(wrap, text, small) {
          var p = document.createElement('p');
          p.style.cssText =
            small
              ? 'font-size:0.75rem;margin:0.6rem 0 0;opacity:0.88;line-height:1.4'
              : 'font-size:0.875rem;margin:0;opacity:0.92;line-height:1.45';
          p.textContent = text;
          wrap.appendChild(p);
        }
        setTimeout(function () {
          var boot = document.getElementById('mojigana-boot');
          if (!boot) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.replaceChildren();
          var wrap = document.createElement('div');
          wrap.style.cssText =
            'padding:1.25rem;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;box-sizing:border-box;line-height:1.45';
          var h = document.createElement('p');
          h.style.cssText = 'font-weight:700;margin:0 0 0.6rem';
          h.textContent = 'MojiGana could not finish loading.';
          wrap.appendChild(h);
          addP(
            wrap,
            'The app JavaScript bundle did not start. Try: disable content blockers for github.io, turn off iCloud Private Relay for Wi‑Fi (if on), use a solid connection, or open this page in a private tab. The address must include the repo path, e.g. …/mojigana-web/',
            false,
          );
          if (document.querySelector('meta[name="mojigana-inline-js"]')) {
            addP(
              wrap,
              'The app script is embedded in this page (no separate .js file). If you still see this, Safari may be blocking inline scripts — check Safari → Settings → Advanced, turn off experimental features, or try another browser.',
              true,
            );
          } else {
            var mod =
              document.querySelector('script[defer][src*="/assets/"]') ||
              document.querySelector('script[type="module"][src]');
            var src = mod && mod.getAttribute('src');
            if (src) {
              var abs = new URL(src, location.href).href;
              addP(wrap, 'Script URL: ' + abs, true);
              fetch(abs, { cache: 'no-store', credentials: 'same-origin' })
                .then(function (r) {
                  addP(
                    wrap,
                    'Network check: HTTP ' + r.status + ' ' + r.statusText + (r.ok ? ' (file reached your phone, but Safari did not run it — try an iOS update or another browser).' : ' (could not load the file — wrong URL or site not deployed yet).'),
                    true,
                  );
                })
                .catch(function (e) {
                  addP(wrap, 'Network check failed: ' + (e && e.message ? e.message : String(e)), true);
                });
            }
          }
          root.appendChild(wrap);
        }, ms);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
