<!doctype html>
<html lang="en">
  <head>
    <style>
      /* Runs before JS; avoids a blank white flash if the bundle fails on some browsers */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #0f172a;
      }
    </style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="MojiGana — practice hiragana, katakana, and Japanese number readings."
    />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>MojiGana</title>
  </head>
  <body>
    <div id="root">
      <p
        id="mojigana-boot"
        style="
          margin: 0;
          padding: 1.25rem;
          font-family: system-ui, sans-serif;
          font-size: 0.9rem;
          color: #94a3b8;
        "
      >
        Loading…
      </p>
    </div>
    <!-- Runs without ES modules: if the main bundle never executes (blocked/failed), this still fires -->
    <script>
      (function () {
        var ms = 12000;
        setTimeout(function () {
          var boot = document.getElementById('mojigana-boot');
          if (!boot) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.replaceChildren();
          var wrap = document.createElement('div');
          wrap.style.cssText =
            'padding:1.25rem;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;box-sizing:border-box;line-height:1.45';
          var h = document.createElement('p');
          h.style.cssText = 'font-weight:700;margin:0 0 0.6rem';
          h.textContent = 'MojiGana could not finish loading.';
          var t = document.createElement('p');
          t.style.cssText = 'font-size:0.875rem;margin:0;opacity:0.92';
          t.textContent =
            'The main script may be blocked or failed. Try: disable content blockers for this GitHub Pages site, turn off iCloud Private Relay for Wi‑Fi (if on), use a strong connection, or open this URL in a private tab. Full address must include the repo name, e.g. …/mojigana-web/';
          wrap.appendChild(h);
          wrap.appendChild(t);
          root.appendChild(wrap);
        }, ms);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
